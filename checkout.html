<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Checkout | TMart</title>
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/navbar.css" />
    <link rel="stylesheet" href="css/footer.css" />
    <link rel="stylesheet" href="css/checkout.css" />
    <link rel="stylesheet" href="css/responsive.css" />
    <link rel="stylesheet" href="css/animations.css" />
  </head>
  <body>
    <div class="toast-root" id="toastRoot"></div>
    <header class="topbar">
      <nav class="navbar container">
        <a class="brand" href="index.html"><span class="brand-mark">T</span><span>TMart</span></a>
      </nav>
    </header>

    <main class="container page-section">
      <div class="checkout-layout">
        <section class="checkout-form-card">
          <h2>Delivery details</h2>
          <form id="checkoutForm" class="checkout-form">
            <input type="text" id="receiverName" placeholder="Receiver name" required />
            <input type="tel" id="mobile" placeholder="Mobile number" required />
            <input type="email" id="email" placeholder="Email" required />
            <input type="text" id="house" placeholder="House number" required />
            <input type="text" id="street" placeholder="Street" required />
            <input type="text" id="area" placeholder="Area" required />
            <input type="text" id="landmark" placeholder="Landmark" />
            <input type="text" id="city" placeholder="City" required />
            <input type="text" id="district" placeholder="District" required />
            <input type="text" id="state" placeholder="State" required />
            <input type="text" id="country" placeholder="Country" required />
            <input type="text" id="pincode" placeholder="Pincode" required />
            <select id="addressType"><option>Home</option><option>Work</option><option>Other</option></select>
            <textarea id="instructions" placeholder="Delivery instructions"></textarea>
            <label class="checkbox-row"><input type="checkbox" id="saveAddress" /> Save this address</label>
            <button type="submit" class="btn btn-primary">Continue to payment</button>
          </form>
        </section>
        <aside class="summary-card" id="checkoutSummary"></aside>
      </div>
    </main>

    <footer class="footer">
      <div class="footer-bottom">© 2026 TMart. Crafted with elegance.</div>
    </footer>

    <script src="js/storage.js"></script>
    <script src="js/checkout.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>

<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Payment | TMart</title>
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/navbar.css" />
    <link rel="stylesheet" href="css/footer.css" />
    <link rel="stylesheet" href="css/checkout.css" />
    <link rel="stylesheet" href="css/responsive.css" />
    <link rel="stylesheet" href="css/animations.css" />
  </head>
  <body>
    <div class="toast-root" id="toastRoot"></div>
    <header class="topbar">
      <nav class="navbar container">
        <a class="brand" href="index.html"><span class="brand-mark">T</span><span>TMart</span></a>
      </nav>
    </header>

    <main class="container page-section">
      <div class="checkout-layout">
        <section class="checkout-form-card">
          <h2>Select payment method</h2>
          <div class="payment-options" id="paymentOptions"></div>
          <form id="paymentForm" class="checkout-form" style="display:none">
            <input type="text" id="cardHolder" placeholder="Card holder name" />
            <input type="text" id="cardNumber" placeholder="Card number" />
            <input type="text" id="expiry" placeholder="MM/YY" />
            <input type="text" id="cvv" placeholder="CVV" />
            <button type="submit" class="btn btn-primary">Pay now</button>
          </form>
        </section>
        <aside class="summary-card" id="paymentSummary"></aside>
      </div>
    </main>

    <footer class="footer">
      <div class="footer-bottom">© 2026 TMart. Crafted with elegance.</div>
    </footer>

    <script src="js/storage.js"></script>
    <script src="js/payment.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>

<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Product | TMart</title>
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/navbar.css" />
    <link rel="stylesheet" href="css/footer.css" />
    <link rel="stylesheet" href="css/products.css" />
    <link rel="stylesheet" href="css/cart.css" />
    <link rel="stylesheet" href="css/responsive.css" />
    <link rel="stylesheet" href="css/animations.css" />
  </head>
  <body>
    <div class="toast-root" id="toastRoot"></div>
    <button class="scroll-top" id="scrollTopBtn">↑</button>
    <header class="topbar">
      <nav class="navbar container">
        <a class="brand" href="index.html"><span class="brand-mark">T</span><span>TMart</span></a>
        <div class="nav-links">
          <a href="index.html">Home</a>
          <a href="shop.html">Shop</a>
          <a href="wishlist.html">Wishlist</a>
        </div>
      </nav>
    </header>

    <main class="container page-section">
      <div class="product-detail-layout reveal" id="productDetailLayout"></div>
      <section class="products-section reveal">
        <div class="section-head">
          <div><p class="eyebrow">Recommended</p><h2>You may also like</h2></div>
        </div>
        <div class="product-grid" id="relatedProducts"></div>
      </section>
    </main>

    <div class="modal" id="imageModal" aria-hidden="true">
      <div class="modal-content"><button class="modal-close" id="closeModal">×</button><img id="modalImage" src="" alt="Zoomed product" /></div>
    </div>

    <footer class="footer">
      <div class="footer-bottom">© 2026 TMart. Crafted with elegance.</div>
    </footer>

    <script src="js/storage.js"></script>
    <script src="js/search.js"></script>
    <script src="js/products.js"></script>
    <script src="js/wishlist.js"></script>
    <script src="js/cart.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>

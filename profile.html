<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Profile | TMart</title>
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/navbar.css" />
    <link rel="stylesheet" href="css/footer.css" />
    <link rel="stylesheet" href="css/products.css" />
    <link rel="stylesheet" href="css/cart.css" />
    <link rel="stylesheet" href="css/responsive.css" />
    <link rel="stylesheet" href="css/animations.css" />
  </head>
  <body>
    <div class="toast-root" id="toastRoot"></div>
    <header class="topbar">
      <nav class="navbar container">
        <a class="brand" href="index.html"><span class="brand-mark">T</span><span>TMart</span></a>
        <div class="nav-links">
          <a href="index.html">Home</a>
          <a href="shop.html">Shop</a>
          <a href="wishlist.html">Wishlist</a>
          <a href="profile.html" class="active">Profile</a>
        </div>
      </nav>
    </header>

    <main class="container page-section">
      <section class="profile-card reveal">
        <div class="profile-header">
          <div class="avatar">T</div>
          <div>
            <h1 id="profileName">Guest</h1>
            <p id="profileEmail">guest@example.com</p>
          </div>
        </div>
        <div class="profile-grid">
          <div class="profile-section">
            <h3>Profile details</h3>
            <label>Name<input id="editName" /></label>
            <label>Email<input id="editEmail" /></label>
            <label>Mobile<input id="editMobile" /></label>
            <button class="btn btn-primary" id="saveProfile">Save changes</button>
          </div>
          <div class="profile-section">
            <h3>Saved addresses</h3>
            <div id="savedAddresses"></div>
            <h3>My orders</h3>
            <div id="myOrders"></div>
          </div>
        </div>
        <button class="btn btn-secondary" id="logoutBtn">Logout</button>
      </section>
    </main>

    <footer class="footer">
      <div class="footer-bottom">© 2026 TMart. Crafted with elegance.</div>
    </footer>

    <script src="js/storage.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>

<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign Up | TMart</title>
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/navbar.css" />
    <link rel="stylesheet" href="css/footer.css" />
    <link rel="stylesheet" href="css/auth.css" />
    <link rel="stylesheet" href="css/responsive.css" />
    <link rel="stylesheet" href="css/animations.css" />
  </head>
  <body>
    <div class="toast-root" id="toastRoot"></div>
    <header class="topbar">
      <nav class="navbar container">
        <a class="brand" href="index.html"><span class="brand-mark">T</span><span>TMart</span></a>
        <div class="nav-links">
          <a href="index.html">Home</a>
          <a href="shop.html">Shop</a>
        </div>
      </nav>
    </header>

    <main class="auth-page">
      <section class="auth-card reveal">
        <div class="auth-hero">
          <p class="eyebrow">Create account</p>
          <h1>Join TMart for exclusive deals and effortless shopping.</h1>
          <p>Get access to personal profiles, saved addresses, and premium offers.</p>
        </div>
        <form id="signupForm" class="auth-form">
          <label>Full Name<input type="text" id="signupName" required /></label>
          <label>Email<input type="email" id="signupEmail" required /></label>
          <label>Mobile Number<input type="tel" id="signupMobile" required /></label>
          <label>
            Password
            <div class="password-field">
              <input type="password" id="signupPassword" required />
              <button type="button" class="toggle-password" data-target="signupPassword">Show</button>
            </div>
          </label>
          <label>
            Confirm Password
            <div class="password-field">
              <input type="password" id="confirmPassword" required />
              <button type="button" class="toggle-password" data-target="confirmPassword">Show</button>
            </div>
          </label>
          <button type="submit" class="btn btn-primary w-full">Create account</button>
          <p id="signupError" class="form-error"></p>
        </form>
      </section>
    </main>

    <footer class="footer">
      <div class="footer-bottom">© 2026 TMart. Crafted with elegance.</div>
    </footer>

    <script src="js/storage.js"></script>
    <script src="js/validation.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
